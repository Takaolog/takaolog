<style>

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#333;
    line-height:1.8;
}

header{
    position:relative;
    color:white;
    text-align:center;
    padding:90px 20px;
    overflow:hidden;
}
.header-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
}
.header-overlay{
    position:absolute;
    inset:0;
    background:transparent;
    z-index:1;
}
.header-content{
    position:relative;
    z-index:2;
}

header h1{
    margin:0;
    font-size:4rem;
    font-weight:700;
}

header .subtitle{
    margin-top:10px;
    font-size:1.2rem;
    letter-spacing:2px;
    color:#cbd5e1;
}



header p{
    margin-top:20px;
    font-size:1.1rem;
    color:#e5e7eb;
}

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

section{
    background:white;
    padding:30px;
    margin-bottom:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,0.05);
}

h2{
    margin-top:0;
    border-left:5px solid #2563eb;
    padding-left:12px;
}

.quote{
    font-style:italic;
    color:#666;
    margin-top:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin:25px 0;
}

.stat-card{
    background:#f8fafc;
    border-radius:10px;
    padding:18px;
    text-align:center;
    border:1px solid #e5e7eb;
}

.stat-card strong{
    display:block;
    font-size:1.4rem;
    color:#1f2937;
}

#chartdiv{
    width:100%;
    height:550px;
    margin-top:20px;
    border-radius:12px;
    overflow:hidden;
}

.category{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.category-card{
    background:#f8fafc;
    border-radius:10px;
    padding:20px;
    border:1px solid #e5e7eb;
}

.category-card strong{
    font-size:1.2rem;
}

.video-wrap{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:12px;
    overflow:hidden;
    background:#000;
}

.video-wrap iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

.article-list{
    list-style:none;
    padding:0;
}

.article-list li{
    margin-bottom:12px;
}

.article-list a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.article-list a:hover{
    text-decoration:underline;
}

.button{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:10px 20px;
    border-radius:8px;
    text-decoration:none;
}

.button:hover{
    background:#1d4ed8;
}



.post-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:25px;
    background:#fafafa;
}

.post-card h3{
    margin-top:10px;
    margin-bottom:10px;
    font-size:1.3rem;
    line-height:1.5;
}

.post-card p{
    margin-bottom:20px;
}

.post-category{
    display:inline-block;
    background:#dbeafe;
    color:#1e40af;
    padding:4px 10px;
    border-radius:20px;
    font-size:0.9rem;
    font-weight:bold;
}

.post-date{
    color:#666;
    font-size:0.95rem;
    margin:8px 0 14px;
}

footer{
    text-align:center;
    padding:40px;
    color:#777;
}

@media(max-width:600px){
    header{
        padding:70px 20px;
    }

    header h1{
        font-size:3rem;
    }

    #chartdiv{
        height:420px;
    }
}


.series-intro{
    color:#555;
    margin-bottom:22px;
}
.series-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
}
.post-card{
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:24px;
    background:#fafafa;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.post-card h3{
    margin:2px 0 4px;
    font-size:1.22rem;
    line-height:1.5;
}
.post-card p{
    margin:0 0 12px;
    flex:1;
}
.post-category{
    align-self:flex-start;
}
.post-date{
    color:#666;
    font-size:0.95rem;
    margin:0 0 6px;
}

</style>
