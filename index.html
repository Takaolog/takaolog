<script>
(function(){
    const video1 = document.querySelector('.video1');
    const video2 = document.querySelector('.video2');

    if (!video1 || !video2) return;

    let active = video1;
    let next = video2;
    let fading = false;

    function crossfade(){
        if (fading || !active.duration) return;
        fading = true;

        next.currentTime = 0;
        next.play().catch(() => {});

        next.style.opacity = '1';
        active.style.opacity = '0';

        setTimeout(function(){
            active.pause();
            active.currentTime = 0;
            const temp = active;
            active = next;
            next = temp;
            fading = false;
            active.addEventListener('timeupdate', checkTime);
        }, 500);
    }

    function checkTime(){
        if (!active.duration || fading) return;
        if (active.currentTime >= active.duration - 0.5){
            active.removeEventListener('timeupdate', checkTime);
            crossfade();
        }
    }

    video1.addEventListener('timeupdate', checkTime);
})();
</script>
